services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: logiroute-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: logiroute
      POSTGRES_USER: logiroute
      POSTGRES_PASSWORD: logiroute_dev_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiroute -d logiroute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
